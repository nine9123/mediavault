name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: 192.168.178.40:30008
  IMAGE_NAME: nine9/mediavault
  FACEREC_IMAGE_NAME: nine9/facerec
  WATCHTOWER_SCOPE: mediavault   # must match the watchtower.scope label on the app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Gitea registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ env.REGISTRY }} \
            -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Build image
        run: |
          SHA_SHORT=$(echo "${{ gitea.sha }}" | cut -c1-8)
          docker build \
            --label "org.opencontainers.image.revision=${{ gitea.sha }}" \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHA_SHORT} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            .
          echo "SHA_SHORT=${SHA_SHORT}" >> "$GITEA_ENV"

      - name: Push image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.SHA_SHORT }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Build facerec image
        run: |
          # -f/context pinned explicitly to facerec/ — this is a separate
          # Dockerfile from the root one, don't let this silently drift back
          # to building the main app under the facerec tag.
          docker build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.revision=${{ gitea.sha }}" \
            -f facerec/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.FACEREC_IMAGE_NAME }}:${{ env.SHA_SHORT }} \
            -t ${{ env.REGISTRY }}/${{ env.FACEREC_IMAGE_NAME }}:latest \
            facerec/

      - name: Push facerec image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.FACEREC_IMAGE_NAME }}:${{ env.SHA_SHORT }}
          docker push ${{ env.REGISTRY }}/${{ env.FACEREC_IMAGE_NAME }}:latest

      - name: Trigger watchtower update
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
            "http://${{ secrets.TRUENAS_LAN_IP }}/v1/update?scope=${{ env.WATCHTOWER_SCOPE }}"
