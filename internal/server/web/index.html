<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mediavault</title>
<style>
  /* ------------------------------------------------------------------ *
   * Direction: a private film/media archive as a darkroom contact sheet.
   * Warm ink ground, bone text, a brass "safelight" accent used sparingly
   * (it doubles as the live scan indicator), and a monospace catalog voice
   * for filenames, counts, and the viewer's index card.
   * ------------------------------------------------------------------ */
  :root {
    --ink:        #141210;  /* warm near-black ground */
    --ink-raised: #1e1b18;  /* bars, cells */
    --ink-line:   #2c2823;  /* hairline frames/dividers */
    --ink-line-2: #3a352e;  /* hover frame */
    --bone:       #ede8df;  /* primary text */
    --bone-dim:   #9a9186;  /* metadata / secondary */
    --bone-faint: #6a635b;  /* captions, disabled */
    --brass:      #d9a441;  /* safelight accent — used sparingly */
    --brass-soft: #a67f34;

    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    --gap: 6px;
    --cell-min: 152px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--ink);
    color: var(--bone);
    font-family: var(--sans);
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  /* ---- archive header ---- */
  .bar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 18px;
    padding: 12px 16px;
    background: color-mix(in srgb, var(--ink-raised) 92%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--ink-line);
    flex-wrap: wrap;
  }
  .mark {
    display: flex; align-items: center; gap: 9px;
    font-family: var(--mono);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-size: 13px;
    color: var(--bone);
    white-space: nowrap;
    user-select: none;
  }
  /* the safelight: on = amber + slow pulse while a scan runs */
  .safelight {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--ink-line-2);
    box-shadow: inset 0 0 0 1px var(--ink-line-2);
    transition: background .3s ease, box-shadow .3s ease;
  }
  .safelight.on {
    background: var(--brass);
    box-shadow: 0 0 8px 1px color-mix(in srgb, var(--brass) 60%, transparent);
    animation: pulse 1.7s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  .search {
    flex: 1 1 260px; min-width: 180px;
    display: flex; align-items: center; gap: 8px;
    background: var(--ink); color: var(--bone);
    border: 1px solid var(--ink-line);
    border-radius: 2px;
    padding: 8px 11px;
  }
  .search:focus-within { border-color: var(--brass-soft); }
  .search svg { flex: none; color: var(--bone-faint); }
  .search input {
    flex: 1; border: 0; background: transparent; color: inherit;
    font-family: var(--mono); font-size: 13px; letter-spacing: .02em;
  }
  .search input::placeholder { color: var(--bone-faint); }
  .search input:focus { outline: none; }

  .readout {
    font-family: var(--mono); font-size: 12px; color: var(--bone-dim);
    letter-spacing: .03em; white-space: nowrap;
    display: flex; align-items: center; gap: 8px;
  }
  .readout .n { color: var(--bone); }

  .btn {
    font-family: var(--mono); font-size: 12px; letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--bone-dim);
    background: transparent;
    border: 1px solid var(--ink-line);
    border-radius: 2px;
    padding: 8px 13px; cursor: pointer;
    transition: color .15s, border-color .15s;
    white-space: nowrap;
  }
  .btn:hover { color: var(--brass); border-color: var(--brass-soft); }
  .btn:disabled { color: var(--bone-faint); border-color: var(--ink-line); cursor: default; }

  /* ---- contact sheet ---- */
  .sheet { padding: var(--gap); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(var(--cell-min), 1fr));
    gap: var(--gap);
  }
  .cell {
    position: relative;
    aspect-ratio: 1 / 1;
    background: var(--ink-raised);
    border: 1px solid var(--ink-line);
    overflow: hidden;
    cursor: pointer;
  }
  .cell:hover { border-color: var(--ink-line-2); }
  .cell:hover .name { opacity: 1; }
  .cell img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    opacity: 0; transition: opacity .25s ease;
  }
  .cell img.ok { opacity: 1; }
  .noprev {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 10px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--bone-faint);
  }
  .badge {
    position: absolute; top: 6px; left: 6px;
    font-family: var(--mono); font-size: 10px; letter-spacing: .06em;
    color: var(--bone); background: color-mix(in srgb, var(--ink) 72%, transparent);
    border: 1px solid var(--ink-line);
    padding: 2px 5px; border-radius: 2px;
    pointer-events: none;
  }
  .badge.vid { color: var(--brass); }
  .name {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 16px 7px 6px;
    font-family: var(--mono); font-size: 11px; color: var(--bone);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: linear-gradient(transparent, color-mix(in srgb, var(--ink) 88%, transparent));
    opacity: 0; transition: opacity .15s ease;
    pointer-events: none;
  }

  /* ---- states ---- */
  .state {
    padding: 80px 24px; text-align: center;
    font-family: var(--mono); font-size: 13px; line-height: 1.7;
    color: var(--bone-dim); letter-spacing: .02em;
  }
  .state .lead { color: var(--bone); display: block; margin-bottom: 6px; letter-spacing: .06em; }
  .state.err .lead { color: var(--brass); }
  .sentinel {
    height: 48px; display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 11px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--bone-faint);
  }
  .hidden { display: none !important; }

  /* ---- lightbox / viewer ---- */
  .viewer {
    position: fixed; inset: 0; z-index: 50;
    display: none;
    background: color-mix(in srgb, var(--ink) 94%, transparent);
    backdrop-filter: blur(10px);
  }
  .viewer.open { display: grid; grid-template-columns: 1fr 300px; }
  .stage {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    padding: 28px; min-width: 0; min-height: 0;
  }
  .stage img, .stage video {
    max-width: 100%; max-height: 100%;
    object-fit: contain; display: block;
    background: #000;
    box-shadow: 0 24px 80px rgba(0,0,0,.6);
  }
  .nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 46px; height: 72px;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: 0; cursor: pointer;
    color: var(--bone-dim); font-size: 30px; line-height: 1;
    transition: color .15s;
  }
  .nav:hover { color: var(--brass); }
  .nav.prev { left: 6px; }
  .nav.next { right: 6px; }
  .close {
    position: absolute; top: 12px; right: 12px;
    width: 34px; height: 34px; padding: 0;
    font-size: 20px; line-height: 1;
    color: var(--bone-dim); background: transparent;
    border: 1px solid var(--ink-line); border-radius: 2px; cursor: pointer;
  }
  .close:hover { color: var(--brass); border-color: var(--brass-soft); }

  /* the index card */
  .card {
    border-left: 1px solid var(--ink-line);
    background: var(--ink-raised);
    padding: 22px 20px; overflow-y: auto;
    font-family: var(--mono);
  }
  .card h2 {
    margin: 0 0 16px; font-size: 11px; letter-spacing: .2em;
    text-transform: uppercase; color: var(--brass); font-weight: 600;
  }
  .row { padding: 9px 0; border-top: 1px solid var(--ink-line); }
  .row:first-of-type { border-top: 0; }
  .k { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--bone-faint); }
  .v { font-size: 12.5px; color: var(--bone); margin-top: 3px; word-break: break-word; line-height: 1.5; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .tag {
    display: inline-flex; align-items: center;
    font-size: 11px; letter-spacing: .02em;
    color: var(--bone); background: var(--ink);
    border: 1px solid var(--ink-line); border-radius: 2px;
    padding: 3px 7px;
  }
  .tag.ai { color: var(--bone-dim); border-style: dashed; }
  .tag .ns { color: var(--brass-soft); }
  .tag .src { color: var(--bone-faint); font-size: 9px; margin-left: 4px; }
  .tag .taglabel { cursor: pointer; }
  .tag .x {
    margin-left: 6px; padding: 0 2px;
    background: transparent; border: 0; cursor: pointer;
    color: var(--bone-faint); font-size: 13px; line-height: 1;
  }
  .tag .x:hover { color: var(--brass); }
  .tagadd {
    margin-top: 8px; width: 100%;
    background: var(--ink); color: var(--bone);
    border: 1px solid var(--ink-line); border-radius: 2px;
    padding: 7px 9px; font-family: var(--mono); font-size: 12px;
  }
  .tagadd:focus { outline: none; border-color: var(--brass-soft); }
  .tagadd::placeholder { color: var(--bone-faint); }
  .taghint { margin-top: 6px; min-height: 14px; font-size: 11px; }
  .muted { color: var(--bone-faint); font-size: 12px; }

  /* the one bold use of brass-as-fill: a safelight-bright "new items" pill */
  .chip {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    z-index: 40;
    font-family: var(--mono); font-size: 12px; letter-spacing: .06em;
    color: var(--ink); background: var(--brass);
    border: 0; border-radius: 999px; padding: 9px 16px; cursor: pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  .chip:hover { filter: brightness(1.08); }

  /* ---- responsive: card becomes a bottom sheet ---- */
  @media (max-width: 720px) {
    :root { --cell-min: 108px; }
    .viewer.open { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    .card { border-left: 0; border-top: 1px solid var(--ink-line); max-height: 42vh; padding: 16px; }
    .readout { order: 3; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, .cell img, .safelight { transition: none !important; animation: none !important; }
  }
  .unplayable{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.75rem;padding:3rem 1.5rem;text-align:center}
  .unplayable p{margin:0;color:var(--bone);font-family:var(--mono);font-size:.9rem;letter-spacing:.02em}
  .unplayable p.sub{color:var(--bone-faint);font-size:.8rem;word-break:break-all}
  .unplayable a{margin-top:.4rem;color:var(--brass);text-decoration:none;font-family:var(--mono);font-size:.8rem;border:1px solid var(--brass-soft);padding:.5rem .9rem;border-radius:2px}
  .unplayable a:hover{background:var(--brass);color:var(--ink)}
</style>
</head>
<body>
  <header class="bar">
    <div class="mark"><span class="safelight" id="safelight"></span>mediavault</div>
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path>
      </svg>
      <input id="q" type="search" placeholder="Search files and tags" autocomplete="off" spellcheck="false" aria-label="Search files and tags">
    </label>
    <span class="readout" id="readout"><span class="n">—</span> items</span>
    <button class="btn" id="rescan">Rescan</button>
  </header>

  <main class="sheet">
    <div class="grid" id="grid"></div>
    <div class="sentinel hidden" id="sentinel">loading</div>
    <div class="state hidden" id="state"></div>
  </main>

  <button class="chip hidden" id="chip" aria-live="polite">&#8593; <span id="chipn">0</span> new</button>

  <div class="viewer" id="viewer" aria-hidden="true">
    <div class="stage" id="stage">
      <button class="nav prev" id="prev" aria-label="Previous">&#8249;</button>
      <button class="nav next" id="next" aria-label="Next">&#8250;</button>
      <button class="close" id="close" aria-label="Close">&times;</button>
    </div>
    <aside class="card" id="card"></aside>
  </div>

<script>
(function () {
  "use strict";

  var PAGE = 120;

  var S = {
    mode: "browse",   // browse | search
    query: "",
    items: [],        // display order: newest id first
    maxId: null,      // highest id loaded (top of grid)
    minId: null,      // lowest id loaded (bottom of grid)
    doneOlder: false, // no older items remain
    busyOlder: false,
    busyNewer: false,
    viewIndex: -1,
    viewerOpen: false,
    scanning: false
  };

  var el = {
    grid: document.getElementById("grid"),
    sentinel: document.getElementById("sentinel"),
    state: document.getElementById("state"),
    readout: document.getElementById("readout"),
    safelight: document.getElementById("safelight"),
    q: document.getElementById("q"),
    rescan: document.getElementById("rescan"),
    viewer: document.getElementById("viewer"),
    stage: document.getElementById("stage"),
    card: document.getElementById("card"),
    prev: document.getElementById("prev"),
    next: document.getElementById("next"),
    close: document.getElementById("close")
  };

  function api(path) {
    return fetch(path).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  function showState(cls, lead, rest) {
    el.state.className = "state" + (cls ? " " + cls : "");
    el.state.innerHTML = "";
    if (lead) {
      var s = document.createElement("span");
      s.className = "lead";
      s.textContent = lead;
      el.state.appendChild(s);
    }
    if (rest) el.state.appendChild(document.createTextNode(rest));
    el.state.classList.remove("hidden");
  }
  function clearState() { el.state.classList.add("hidden"); }

  function fmtDuration(sec) {
    sec = Math.round(sec || 0);
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }
  function baseName(rel) {
    var i = rel.lastIndexOf("/");
    return i >= 0 ? rel.slice(i + 1) : rel;
  }

  // ---- cells ----
  function noPreview() {
    var d = document.createElement("div");
    d.className = "noprev";
    d.textContent = "no preview";
    return d;
  }

  function makeCell(item) {
    var cell = document.createElement("div");
    cell.className = "cell";
    // resolve index at click time so prepends/appends never desync handlers
    cell.addEventListener("click", function () {
      var i = S.items.indexOf(item);
      if (i >= 0) openViewer(i);
    });

    if (item.thumb_ready) {
      var img = document.createElement("img");
      img.loading = "lazy";
      img.decoding = "async";
      img.alt = baseName(item.relpath);
      img.addEventListener("load", function () { img.classList.add("ok"); });
      img.addEventListener("error", function () { img.remove(); cell.appendChild(noPreview()); });
      img.src = item.thumb_url;
      cell.appendChild(img);
    } else {
      cell.appendChild(noPreview());
    }

    var badge = document.createElement("span");
    badge.className = "badge" + (item.type === "video" ? " vid" : "");
    if (item.type === "video") badge.textContent = "VID " + fmtDuration(item.duration);
    else if (item.type === "animated") badge.textContent = "GIF";
    else badge.textContent = "IMG";
    cell.appendChild(badge);

    var name = document.createElement("div");
    name.className = "name";
    name.textContent = baseName(item.relpath);
    cell.appendChild(name);

    return cell;
  }

  function trackBounds(item) {
    if (S.maxId === null || item.id > S.maxId) S.maxId = item.id;
    if (S.minId === null || item.id < S.minId) S.minId = item.id;
  }

  function appendItem(item) {
    S.items.push(item);
    el.grid.appendChild(makeCell(item));
    trackBounds(item);
  }

  function reset() {
    S.items = [];
    S.maxId = null;
    S.minId = null;
    S.doneOlder = false;
    el.grid.innerHTML = "";
    clearState();
  }

  function emptyBrowse() {
    showState("", "No items yet.",
      "If a scan is running, thumbnails appear here as files are processed. Otherwise add media under your media root and press Rescan.");
  }

  // ---- initial + older (infinite scroll) ----
  function loadInitial() {
    S.busyOlder = true;
    el.sentinel.classList.remove("hidden");
    el.sentinel.textContent = "loading";
    return api("/api/items?limit=" + PAGE).then(function (d) {
      var batch = d.items || [];
      if (batch.length === 0) {
        // Nothing indexed yet. Leave maxId/minId null so pollStats keeps
        // retrying loadInitial (not loadNewer) until the scan commits its first
        // items; then normal newest-first paging + live prepend take over. (If
        // we primed a cursor here, the whole library would instead arrive via
        // slow top-prepends and scrolling down would never load anything.)
        emptyBrowse();
        el.sentinel.classList.add("hidden");
        return;
      }
      batch.forEach(appendItem);
      if (batch.length < PAGE) S.doneOlder = true;
      clearState();
      el.sentinel.classList.toggle("hidden", S.doneOlder);
    }).catch(function (e) {
      S.doneOlder = true;
      el.sentinel.classList.add("hidden");
      if (S.items.length === 0) showState("err", "Can't reach the server.", "Is mediavault still running? (" + e.message + ")");
    }).finally(function () { S.busyOlder = false; });
  }

  function loadOlder() {
    if (S.mode !== "browse" || S.busyOlder || S.doneOlder || S.minId === null) return null;
    S.busyOlder = true;
    el.sentinel.classList.remove("hidden");
    el.sentinel.textContent = "loading";
    return api("/api/items?before=" + S.minId + "&limit=" + PAGE).then(function (d) {
      var batch = d.items || [];
      batch.forEach(appendItem);
      if (batch.length < PAGE) S.doneOlder = true;
      el.sentinel.classList.toggle("hidden", S.doneOlder);
    }).catch(function () {}).finally(function () { S.busyOlder = false; });
  }

  // Load older pages until the document is tall enough to scroll. On a large or
  // tall screen the first page may not fill the viewport, leaving nothing to
  // scroll — so the observer/scroll triggers never fire. Stops when filled,
  // exhausted, or a load makes no progress (e.g. a failed request), so it never
  // busy-loops.
  function fillViewport() {
    if (S.mode !== "browse" || S.doneOlder) return;
    if (document.body.scrollHeight > window.innerHeight + 1000) return;
    var before = S.items.length;
    var p = loadOlder();
    if (!p || !p.then) return;
    p.then(function () { if (S.items.length > before) fillViewport(); });
  }

  // ---- newer (live stream, prepend at top) ----
  function loadNewer() {
    if (S.mode !== "browse" || S.busyNewer || S.viewerOpen || S.maxId === null) return;
    S.busyNewer = true;
    api("/api/items?after=" + S.maxId + "&limit=" + PAGE).then(function (d) {
      var batch = d.items || []; // ascending by id (oldest-new first)
      if (batch.length === 0) return;
      clearState();

      var atTop = (window.scrollY || document.documentElement.scrollTop || 0) < 60;
      var before = document.body.scrollHeight;

      var frag = document.createDocumentFragment();
      for (var i = batch.length - 1; i >= 0; i--) frag.appendChild(makeCell(batch[i]));
      el.grid.insertBefore(frag, el.grid.firstChild);

      var desc = batch.slice().reverse(); // newest first
      S.items = desc.concat(S.items);
      desc.forEach(trackBounds);

      // if the reader has scrolled down, keep their view fixed; new items wait above
      if (!atTop) window.scrollBy(0, document.body.scrollHeight - before);
    }).catch(function () {}).finally(function () { S.busyNewer = false; });
  }

  // ---- search ----
  function runSearch() {
    el.sentinel.classList.add("hidden");
    api("/api/search?q=" + encodeURIComponent(S.query) + "&limit=200").then(function (d) {
      var batch = d.items || [];
      batch.forEach(function (it) { S.items.push(it); el.grid.appendChild(makeCell(it)); });
      if (batch.length === 0) showState("", "No matches", "for \u201c" + S.query + "\u201d.");
    }).catch(function (e) {
      showState("err", "Can't reach the server.", "(" + e.message + ")");
    });
  }

  // infinite scroll (older)
  var io = new IntersectionObserver(function (entries) {
    if (entries[0].isIntersecting) loadOlder();
  }, { rootMargin: "800px" });
  io.observe(el.sentinel);

  // Backstop for the observer: also load older items when scrolled near the
  // bottom, in case a hidden-at-observe-time sentinel is missed. loadOlder's own
  // guards (busy/done/mode/cursor) prevent any double-loading.
  function nearBottomLoad() {
    if ((window.innerHeight + (window.scrollY || 0)) >= document.body.scrollHeight - 900) loadOlder();
  }
  window.addEventListener("scroll", nearBottomLoad, { passive: true });
  window.addEventListener("resize", fillViewport);

  // search (debounced)
  var searchTimer = null;
  el.q.addEventListener("input", function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      var v = el.q.value.trim();
      S.query = v;
      if (v === "") { S.mode = "browse"; reset(); loadInitial().then(fillViewport); }
      else { S.mode = "search"; reset(); runSearch(); }
    }, 250);
  });

  // rescan
  el.rescan.addEventListener("click", function () {
    el.rescan.disabled = true;
    fetch("/api/scan", { method: "POST" }).catch(function () {}).finally(function () {
      setTimeout(pollStats, 400);
      setTimeout(function () { el.rescan.disabled = false; }, 1500);
    });
  });

  // stats: live header + drives the live stream
  function pollStats() {
    api("/api/stats").then(function (st) {
      S.scanning = !!st.scanning;
      el.safelight.classList.toggle("on", S.scanning);
      var n = (st.items || 0).toLocaleString();
      var txt = "<span class=\"n\">" + n + "</span> items";
      if (S.scanning) txt += " \u00b7 scanning\u2026";
      else if (st.last && st.last.added) txt += " \u00b7 +" + st.last.added + " last scan";
      el.readout.innerHTML = txt;

      // recover if the first load failed while the server was still starting
      if (S.mode === "browse" && S.items.length === 0 && S.maxId === null && !S.busyOlder) {
        loadInitial().then(fillViewport);
        return;
      }
      // stream newly-indexed items into the grid
      if (S.mode === "browse" && !S.viewerOpen) loadNewer();
    }).catch(function () { /* leave header as-is */ });
  }

  // clicking a tag chip searches for that tag
  function searchTag(str) {
    closeViewer();
    el.q.value = str;
    S.query = str;
    S.mode = "search";
    reset();
    runSearch();
  }

  // ---- viewer ----
  function openViewer(index) {
    if (index < 0 || index >= S.items.length) return;
    S.viewIndex = index;
    S.viewerOpen = true;
    renderStage();
    renderCard();
    el.viewer.classList.add("open");
    el.viewer.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
  }

  function showUnplayable(item, node) {
    if (node && node.parentNode) { if (node.tagName === "VIDEO") node.src = ""; node.remove(); }
    if (S.items[S.viewIndex] !== item || el.stage.querySelector(".unplayable")) return;
    var box = document.createElement("div");
    box.className = "unplayable";
    var p = document.createElement("p");
    p.textContent = item.type === "video"
      ? "This format won\u2019t play in the browser."
      : "This format can\u2019t be shown in the browser.";
    var sub = document.createElement("p");
    sub.className = "sub";
    sub.textContent = baseName(item.relpath);
    var a = document.createElement("a");
    a.href = item.raw_url; a.target = "_blank"; a.rel = "noopener";
    a.textContent = "Open / download original";
    box.appendChild(p); box.appendChild(sub); box.appendChild(a);
    el.stage.insertBefore(box, el.stage.firstChild);
  }

  function renderStage() {
    var item = S.items[S.viewIndex];
    el.stage.querySelectorAll("img, video, .unplayable").forEach(function (n) {
      if (n.tagName === "VIDEO") n.src = "";
      n.remove();
    });

    var media;
    if (item.type === "video") {
      media = document.createElement("video");
      media.src = item.raw_url;
      media.controls = true;
      media.autoplay = true;
      media.playsInline = true;
      media.preload = "metadata";
      media.addEventListener("error", function () { showUnplayable(item, media); });
    } else {
      media = document.createElement("img");
      media.src = item.raw_url;
      media.alt = baseName(item.relpath);
      media.addEventListener("error", function () { showUnplayable(item, media); });
    }
    el.stage.insertBefore(media, el.stage.firstChild);

    el.prev.style.visibility = S.viewIndex > 0 ? "visible" : "hidden";
    var hasNext = S.viewIndex < S.items.length - 1 || !S.doneOlder;
    el.next.style.visibility = hasNext ? "visible" : "hidden";
  }

  function row(k, v) {
    var d = document.createElement("div");
    d.className = "row";
    var kk = document.createElement("div"); kk.className = "k"; kk.textContent = k;
    var vv = document.createElement("div"); vv.className = "v"; vv.textContent = v;
    d.appendChild(kk); d.appendChild(vv);
    return d;
  }

  function renderCard() {
    var item = S.items[S.viewIndex];
    el.card.innerHTML = "";
    var h = document.createElement("h2");
    h.textContent = "Catalog";
    el.card.appendChild(h);

    el.card.appendChild(row("File", baseName(item.relpath)));
    el.card.appendChild(row("Path", item.relpath));
    el.card.appendChild(row("Type", item.type + (item.mime ? "  \u00b7  " + item.mime : "")));
    if (item.width && item.height) el.card.appendChild(row("Dimensions", item.width + " \u00d7 " + item.height));
    if (item.type === "video" && item.duration) el.card.appendChild(row("Duration", fmtDuration(item.duration)));

    var tagRow = document.createElement("div");
    tagRow.className = "row";
    var tk = document.createElement("div"); tk.className = "k"; tk.textContent = "Tags";
    tagRow.appendChild(tk);

    var wrap = document.createElement("div"); wrap.className = "tags";
    tagRow.appendChild(wrap);

    var input = document.createElement("input");
    input.className = "tagadd"; input.type = "text";
    input.placeholder = "Add a tag, press Enter";
    input.autocomplete = "off"; input.spellcheck = false;
    tagRow.appendChild(input);

    var note = document.createElement("div"); note.className = "muted taghint";
    tagRow.appendChild(note);
    el.card.appendChild(tagRow);

    // Editable state for THIS item. Manual tags (from the sidecar) are editable;
    // ai tags are shown read-only. Every add/remove PUTs the full manual list.
    var manual = [];                 // "ns:name" / "name" strings
    var ai = [];                     // { namespace, name }
    function tagStr(t) { return t.namespace ? t.namespace + ":" + t.name : t.name; }

    function chipEl(str, isAI, idx) {
      var chip = document.createElement("span");
      chip.className = "tag" + (isAI ? " ai" : "");
      var label = document.createElement("span");
      label.className = "taglabel";
      var ci = str.indexOf(":");
      if (ci > 0) {
        var ns = document.createElement("span"); ns.className = "ns"; ns.textContent = str.slice(0, ci + 1);
        label.appendChild(ns);
        label.appendChild(document.createTextNode(str.slice(ci + 1)));
      } else {
        label.textContent = str;
      }
      label.title = "Search this tag";
      label.addEventListener("click", function () { searchTag(str); });
      chip.appendChild(label);
      if (isAI) {
        var s = document.createElement("span"); s.className = "src"; s.textContent = "ai";
        chip.appendChild(s);
      } else {
        var x = document.createElement("button");
        x.className = "x"; x.type = "button"; x.textContent = "\u00d7"; x.title = "Remove tag";
        x.addEventListener("click", function (e) {
          e.stopPropagation();
          manual.splice(idx, 1); renderChips(); save();
        });
        chip.appendChild(x);
      }
      return chip;
    }

    function renderChips() {
      wrap.innerHTML = "";
      manual.forEach(function (str, i) { wrap.appendChild(chipEl(str, false, i)); });
      ai.forEach(function (t) { wrap.appendChild(chipEl(tagStr(t), true, -1)); });
      if (manual.length === 0 && ai.length === 0) {
        var m = document.createElement("span"); m.className = "muted"; m.textContent = "No tags yet.";
        wrap.appendChild(m);
      }
    }

    function addFromInput() {
      var raw = input.value; input.value = "";
      raw.split(",").forEach(function (part) {
        var t = part.trim(); if (!t) return;
        var dup = manual.some(function (mm) { return mm.toLowerCase() === t.toLowerCase(); });
        if (!dup) manual.push(t);
      });
      renderChips(); save();
    }

    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); addFromInput(); }
      else if (e.key === "Backspace" && input.value === "" && manual.length) { manual.pop(); renderChips(); save(); }
    });

    var saving = false, again = false;
    function save() {
      if (S.items[S.viewIndex] !== item) return; // navigated away; don't clobber
      if (saving) { again = true; return; }       // coalesce rapid edits
      saving = true; note.textContent = "saving\u2026";
      fetch("/api/tags", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path: item.relpath, tags: manual })
      }).then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      }).then(function () {
        note.textContent = "saved";
        setTimeout(function () { if (note.textContent === "saved") note.textContent = ""; }, 1200);
      }).catch(function (e) {
        note.textContent = "couldn't save (" + e.message + ")";
      }).finally(function () {
        saving = false;
        if (again) { again = false; save(); }
      });
    }

    api("/api/item?path=" + encodeURIComponent(item.relpath)).then(function (d) {
      if (S.items[S.viewIndex] !== item) return; // user moved on
      (d.tags || []).forEach(function (t) {
        if (t.source === "ai") ai.push({ namespace: t.namespace, name: t.name });
        else manual.push(tagStr(t));
      });
      renderChips();
    }).catch(function () { note.textContent = "(couldn't load tags)"; });
  }

  function closeViewer() {
    el.stage.querySelectorAll("img, video, .unplayable").forEach(function (n) {
      if (n.tagName === "VIDEO") n.src = "";
      n.remove();
    });
    el.viewer.classList.remove("open");
    el.viewer.setAttribute("aria-hidden", "true");
    S.viewerOpen = false;
    document.body.style.overflow = "";
  }

  function navigate(delta) {
    var n = S.viewIndex + delta;
    if (n < 0) return;
    if (n >= S.items.length) {
      if (S.mode === "search" || S.doneOlder) return;
      var p = loadOlder();
      if (p) p.then(function () { if (n < S.items.length) openViewer(n); });
      return;
    }
    openViewer(n);
  }

  el.prev.addEventListener("click", function (e) { e.stopPropagation(); navigate(-1); });
  el.next.addEventListener("click", function (e) { e.stopPropagation(); navigate(1); });
  el.close.addEventListener("click", closeViewer);
  el.viewer.addEventListener("click", function (e) {
    if (e.target === el.viewer || e.target === el.stage) closeViewer();
  });
  document.addEventListener("keydown", function (e) {
    if (!S.viewerOpen) return;
    if (e.key === "Escape") closeViewer();
    else if (e.key === "ArrowLeft") navigate(-1);
    else if (e.key === "ArrowRight") navigate(1);
  });

  // ---- boot ----
  loadInitial().then(fillViewport);
  pollStats();
  setInterval(pollStats, 2000);
})();
</script>
</body>
</html>
