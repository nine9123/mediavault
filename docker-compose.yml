services:
  mediavault:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Keep workers modest: reads go over SMB, so the network link — not the
      # CPU — is the bottleneck. 4-8 typically saturates a gigabit mount.
      SCAN_WORKERS: "6"
      # Periodic rescan interval. inotify is unreliable over SMB, so we poll;
      # the UI also has a manual rescan (POST /api/scan).
      SCAN_INTERVAL: "5m"
      THUMB_PX: "400"
      # Content hashing of new files (dedup / move-detection; nothing consumes
      # it yet, it just fills the field). "partial" = cheap head+tail+size
      # fingerprint (recommended). "off" = fastest. "full" = read every byte
      # over the network (slow for big videos).
      HASH_MODE: "partial"
      # Where per-file tag sidecars are written. Set to a writable path (mounted
      # below) so your media mount can stay read-only. Leave empty to write
      # sidecars next to each media file instead (needs a writable media mount).
      SIDECAR_DIR: "/meta"
      # Browser-friendly transcodes/previews for formats a browser can't play
      # (HEVC mp4, avi, mkv, HEIC, RAW, ...). Populate it with
      # scripts/transcode.sh; mediavault serves a derived file when one exists.
      # Leave empty to disable. Expensive to regenerate, so it's its own volume.
      DERIVED_DIR: "/derived"
      # Optional natural-language search: point at an Ollama server running a
      # vision model to auto-caption media (captions feed search). Leave OLLAMA_URL
      # empty/unset to disable. OLLAMA_MODEL must be a vision model you've pulled.
      # OLLAMA_URL: "http://your-truenas-ip:11434"
      # OLLAMA_MODEL: "llava"
      # OLLAMA_EMBED_MODEL: "nomic-embed-text"   # enables *semantic* search (pull it on the Ollama host)
      # Optional People page: point at a face-recognition service (the facerec
      # container below, or your own — see facerec/README.md for the contract).
      # Empty/unset disables faces entirely; nothing else in the app depends on it.
      # FACE_URL: "http://facerec:8000"
      # FACE_MATCH: "0.82"      # cosine threshold; unset = use what the service advertises
      # FACE_FRAME_PX: "1280"   # frame size sent to the detector; larger finds smaller faces
    volumes:
      # Your NAS SMB mount = source of truth. READ-ONLY on purpose.
      - /mnt/nas/media:/media:ro
      # Writable cache: SQLite DB + thumbnails. Safe to delete and rebuild.
      - mediavault-data:/data
      # Your tags/ratings live here — the durable source of truth. Keep this
      # separate from the disposable cache above, and back it up.
      - mediavault-metadata:/meta
      # Browser-friendly derived copies (see DERIVED_DIR). Written by
      # scripts/transcode.sh, read by mediavault. Persist it so you don't
      # re-transcode after clearing the cache.
      - mediavault-derived:/derived

  # Face recognition, in its own container: dlib is a C++ build and the weights
  # are ~100 MB, neither of which belongs in the mediavault image. It gets NO
  # media mount — mediavault extracts each frame with ffmpeg and posts the JPEG.
  #
  # Commented out because it is opt-in and the first build compiles dlib (5-15
  # minutes). To enable: uncomment this block AND FACE_URL above, then
  #   docker compose up -d --build
  # facerec:
  #   build: ./facerec
  #   restart: unless-stopped
  #   environment:
  #     FACE_MODEL: "hog"       # or "cnn": better on small/turned faces, much slower
  #     FACE_UPSAMPLE: "1"      # "2" finds smaller faces at ~4x the cost
  #   # No ports published: only mediavault needs to reach it, over the compose
  #   # network. Publish 8000 only if you want to curl /health from the host.

volumes:
  mediavault-data:
  mediavault-metadata:
  mediavault-derived:
