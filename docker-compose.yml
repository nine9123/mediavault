services:
  mediavault:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Keep workers modest: reads go over SMB, so the network link — not the
      # CPU — is the bottleneck. 4-8 typically saturates a gigabit mount.
      SCAN_WORKERS: "6"
      # Periodic rescan interval. inotify is unreliable over SMB, so we poll;
      # the UI also has a manual rescan (POST /api/scan).
      SCAN_INTERVAL: "5m"
      THUMB_PX: "400"
      # Content hashing of new files (dedup / move-detection; nothing consumes
      # it yet, it just fills the field). "partial" = cheap head+tail+size
      # fingerprint (recommended). "off" = fastest. "full" = read every byte
      # over the network (slow for big videos).
      HASH_MODE: "partial"
      # Where per-file tag sidecars are written. Set to a writable path (mounted
      # below) so your media mount can stay read-only. Leave empty to write
      # sidecars next to each media file instead (needs a writable media mount).
      SIDECAR_DIR: "/meta"
      # Browser-friendly transcodes/previews for formats a browser can't play
      # (HEVC mp4, avi, mkv, HEIC, RAW, ...). Populate it with
      # scripts/transcode.sh; mediavault serves a derived file when one exists.
      # Leave empty to disable. Expensive to regenerate, so it's its own volume.
      DERIVED_DIR: "/derived"
    volumes:
      # Your NAS SMB mount = source of truth. READ-ONLY on purpose.
      - /mnt/nas/media:/media:ro
      # Writable cache: SQLite DB + thumbnails. Safe to delete and rebuild.
      - mediavault-data:/data
      # Your tags/ratings live here — the durable source of truth. Keep this
      # separate from the disposable cache above, and back it up.
      - mediavault-metadata:/meta
      # Browser-friendly derived copies (see DERIVED_DIR). Written by
      # scripts/transcode.sh, read by mediavault. Persist it so you don't
      # re-transcode after clearing the cache.
      - mediavault-derived:/derived

volumes:
  mediavault-data:
  mediavault-metadata:
  mediavault-derived:
