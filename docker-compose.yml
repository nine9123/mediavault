services:
  mediavault:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Keep workers modest: reads go over SMB, so the network link — not the
      # CPU — is the bottleneck. 4-8 typically saturates a gigabit mount.
      SCAN_WORKERS: "6"
      # Periodic rescan interval. inotify is unreliable over SMB, so we poll;
      # the UI also has a manual rescan (POST /api/scan).
      SCAN_INTERVAL: "5m"
      THUMB_PX: "400"
      # Content hashing of new files (dedup / move-detection; nothing consumes
      # it yet, it just fills the field). "partial" = cheap head+tail+size
      # fingerprint (recommended). "off" = fastest. "full" = read every byte
      # over the network (slow for big videos).
      HASH_MODE: "partial"
    volumes:
      # Your NAS SMB mount = source of truth. READ-ONLY on purpose.
      - /mnt/nas/media:/media:ro
      # Writable cache: SQLite DB + thumbnails. Safe to delete and rebuild.
      - mediavault-data:/data

volumes:
  mediavault-data:
